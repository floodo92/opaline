        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap');

        /* 0. Reset & Canvas - 400x460 exacto */
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:400px;height:460px;overflow:hidden;background:#060708;}
        body{margin:0;background:#060708;}

        .page-wrap{
          width:400px;
          height:460px;
          background:#060708;
          display:block;
          position:relative;
          overflow:hidden;
        }

        /* 1. Contenedor raíz #opaline */
        #opaline{
          position:relative;
          width:400px;
          height:460px;
          overflow:hidden;
          background:#060708;
        }

        /* 2. Header - 400x52 */
        .op-header{
          position:absolute;
          top:0; left:0;
          width:400px;
          height:52px;
          background:#060708;
          border-bottom:1px solid rgba(255,255,255,0.055);
        }
        .brand-block{
          position:absolute;
          left:14px;
          top:10px;
          width:140px;
          height:32px;
        }
        .brand-opaline{
          position:absolute;
          left:0; top:0;
          font-family:"Barlow Condensed", sans-serif;
          font-weight:600;
          font-size:18px;
          line-height:18px;
          letter-spacing:0.14em;
          color:#eceef1;
          text-transform:uppercase;
        }
        .brand-sub{
          position:absolute;
          left:0; top:20px;
          font-family:"Inter", sans-serif;
          font-weight:400;
          font-size:9px;
          line-height:10px;
          letter-spacing:0.18em;
          color:#5a626c;
          text-transform:uppercase;
        }

        /* 2b. Botones header */
        .btn{
          position:absolute;
          top:12px;
          width:62px;
          height:28px;
          background:#12151a;
          border:1px solid rgba(255,255,255,0.095);
          border-radius:5px;
          font-family:"Inter", sans-serif;
          font-weight:500;
          font-size:9px;
          letter-spacing:0.08em;
          color:#9aa1ab;
          text-transform:uppercase;
          display:flex;
          align-items:center;
          justify-content:center;
          cursor:default;
          user-select:none;
        }
        .btn-bypass{ left:264px; }
        .btn-measure{ left:332px; }

        /* estado activo botones - sheen opalo sutil */
        .btn.is-active{
          background:#181b21;
          border-color:rgba(255,255,255,0.17);
          color:#eceef1;
        }
        .btn.is-active::before{
          content:"";
          position:absolute;
          top:-1px;
          left:50%;
          margin-left:-12px;
          width:24px;
          height:2px;
          background:linear-gradient(90deg, #9fb8e8 0%, #cfc6f2 55%, #e8c8a8 100%);
          border-radius:1px;
        }

        /* 3. Main panel - unica box-shadow permitida */
        .main-panel{
          position:absolute;
          top:52px;
          left:8px;
          width:384px;
          height:352px;
          background:#12151a;
          border:1px solid rgba(255,255,255,0.055);
          border-radius:10px;
          box-shadow:0 8px 16px rgba(0,0,0,0.5);
          overflow:hidden;
        }

        /* 4. Knob SHINE hero - 156px */
        .knob-hero-wrap{
          position:absolute;
          top:22px;
          left:114px;
          width:156px;
          height:184px;
        }
        .knob-hero{
          position:absolute;
          top:0; left:0;
          width:156px;
          height:156px;
          border-radius:50%;
          background:radial-gradient(circle at 34% 30%, #242831 0%, #1d2129 48%, #15181e 100%);
          border:1px solid rgba(255,255,255,0.095);
        }
        .knob-hero-metal{
          position:absolute;
          top:10px; left:10px;
          width:134px;
          height:134px;
          border-radius:50%;
          background:linear-gradient(180deg, #a9a9b3 0%, #75757f 52%, #484852 100%);
        }
        .knob-hero-inset{
          position:absolute;
          top:13px; left:13px;
          width:128px;
          height:128px;
          border-radius:50%;
          background:radial-gradient(circle at 38% 32%, #22252e 0%, #1d2129 60%, #13161c 100%);
          border:1px solid rgba(255,255,255,0.055);
        }
        .knob-hero-dot{
          position:absolute;
          top:50%; left:50%;
          width:6px; height:6px;
          margin-left:-3px; margin-top:-3px;
          border-radius:50%;
          background:#0e1013;
          border:1px solid rgba(255,255,255,0.095);
        }
        .knob-hero-indicator{
          position:absolute;
          top:50%; left:50%;
          width:2px;
          height:54px;
          margin-left:-1px;
          margin-top:-54px;
          background:rgba(255,255,255,0.9);
          border-radius:1px;
          transform-origin:1px 54px;
          transform:rotate(-135deg);
        }
        /* sheen iridiscente sutil solo cuando activo */
        .knob-hero-wrap.is-active .knob-hero-indicator::after{
          content:"";
          position:absolute;
          top:0; left:0;
          width:2px;
          height:24px;
          background:linear-gradient(180deg, #9fb8e8 0%, #cfc6f2 55%, #e8c8a8 100%);
          opacity:0.6;
          border-radius:1px;
        }

        .knob-hero-label{
          position:absolute;
          top:162px;
          left:0;
          width:156px;
          text-align:center;
          font-family:"Barlow Condensed", sans-serif;
          font-weight:600;
          font-size:13px;
          letter-spacing:0.16em;
          color:#eceef1;
          text-transform:uppercase;
          line-height:13px;
        }
        .knob-hero-value{
          position:absolute;
          top:178px;
          left:0;
          width:156px;
          text-align:center;
          font-family:"JetBrains Mono", monospace;
          font-weight:500;
          font-size:22px;
          line-height:22px;
          color:#eceef1;
          letter-spacing:-0.02em;
        }
        .knob-hero-sub{
          position:absolute;
          top:202px;
          left:0;
          width:156px;
          text-align:center;
          font-family:"JetBrains Mono", monospace;
          font-weight:400;
          font-size:11px;
          color:#9aa1ab;
          line-height:11px;
        }

        /* 5. Meters IN / OUT */
        .meter{
          position:absolute;
          top:24px;
          width:56px;
          height:92px;
        }
        .meter-in{ left:28px; }
        .meter-out{ left:300px; }

        .meter-title{
          position:absolute;
          top:0; left:0;
          width:56px;
          font-family:"Barlow Condensed", sans-serif;
          font-weight:500;
          font-size:10px;
          letter-spacing:0.14em;
          color:#5a626c;
          text-transform:uppercase;
          line-height:10px;
        }
        .meter-row{
          position:absolute;
          left:0;
          width:56px;
          height:16px;
        }
        .meter-row-1{ top:18px; }
        .meter-row-2{ top:40px; }

        .meter-ch{
          position:absolute;
          left:0; top:0;
          width:10px; height:10px;
          font-family:"JetBrains Mono", monospace;
          font-weight:400;
          font-size:9px;
          line-height:10px;
          color:#5a626c;
        }
        .meter-track{
          position:absolute;
          left:12px; top:3px;
          width:42px; height:4px;
          background:#050607;
          border-radius:3px;
          overflow:hidden;
        }
        .meter-fill{
          position:absolute;
          left:0; top:0;
          height:4px;
          border-radius:3px;
          background:linear-gradient(90deg, #181b21 0%, #9aa1ab 100%);
        }
        .meter-fill.in-l{ width:31px; }
        .meter-fill.in-r{ width:32px; }
        .meter-fill.out-l{ width:26px; }
        .meter-fill.out-r{ width:27px; }

        /* estado medido - cambia a safe / warn */
        .meter.is-measured .meter-fill.in-l,
        .meter.is-measured .meter-fill.in-r{
          background:linear-gradient(90deg, #1a2a24 0%, #52c49a 100%);
        }
        .meter.is-measured .meter-fill.out-l,
        .meter.is-measured .meter-fill.out-r{
          background:linear-gradient(90deg, #2a2318 0%, #e0ad5a 100%);
        }

        .meter-values{
          position:absolute;
          top:62px; left:0;
          width:56px;
          font-family:"JetBrains Mono", monospace;
          font-weight:400;
          font-size:9px;
          line-height:11px;
          color:#9aa1ab;
          letter-spacing:-0.01em;
        }
        .meter-values b{
          font-weight:500;
          color:#9aa1ab;
        }

        /* 6. Knobs pequeños BODY/AIR y OUTPUT - 72px */
        .knob-small-wrap{
          position:absolute;
          top:230px;
          width:72px;
          height:98px;
        }
        .knob-small-wrap.body-air{ left:68px; }
        .knob-small-wrap.output{ left:244px; }

        .knob-small{
          position:absolute;
          top:0; left:0;
          width:72px; height:72px;
          border-radius:50%;
          background:radial-gradient(circle at 36% 32%, #242831 0%, #1d2129 55%, #15181e 100%);
          border:1px solid rgba(255,255,255,0.095);
        }
        .knob-small-metal{
          position:absolute;
          top:5px; left:5px;
          width:60px; height:60px;
          border-radius:50%;
          background:linear-gradient(180deg, #a9a9b3 0%, #75757f 50%, #484852 100%);
        }
        .knob-small-inset{
          position:absolute;
          top:7px; left:7px;
          width:56px; height:56px;
          border-radius:50%;
          background:radial-gradient(circle at 38% 34%, #232731 0%, #1d2129 62%, #14171d 100%);
          border:1px solid rgba(255,255,255,0.055);
        }
        .knob-small-dot{
          position:absolute;
          top:50%; left:50%;
          width:4px; height:4px;
          margin-left:-2px; margin-top:-2px;
          border-radius:50%;
          background:#0e1013;
          border:1px solid rgba(255,255,255,0.095);
        }
        .knob-small-indicator{
          position:absolute;
          top:50%; left:50%;
          width:2px;
          height:26px;
          margin-left:-1px;
          margin-top:-26px;
          background:rgba(236,238,241,0.92);
          border-radius:1px;
          transform-origin:1px 26px;
        }
        .knob-small-indicator.body{ transform:rotate(0deg); }
        .knob-small-indicator.out{ transform:rotate(18deg); }

        /* marca central bipolar para BODY/AIR */
        .knob-center-mark{
          position:absolute;
          top:4px; left:50%;
          width:1px; height:8px;
          margin-left:-0.5px;
          background:rgba(255,255,255,0.17);
          border-radius:0.5px;
        }

        .knob-small-label{
          position:absolute;
          top:78px; left:0;
          width:72px;
          text-align:center;
          font-family:"Barlow Condensed", sans-serif;
          font-weight:500;
          font-size:10px;
          letter-spacing:0.12em;
          color:#9aa1ab;
          text-transform:uppercase;
          line-height:10px;
          white-space:nowrap;
        }
        .knob-small-value{
          position:absolute;
          top:90px; left:0;
          width:72px;
          text-align:center;
          font-family:"JetBrains Mono", monospace;
          font-weight:400;
          font-size:13px;
          line-height:13px;
          color:#eceef1;
        }

        /* 7. Footer estado - inset */
        .footer{
          position:absolute;
          bottom:0; left:0;
          width:384px;
          height:28px;
          background:#050607;
          border-top:1px solid rgba(255,255,255,0.055);
        }
        .footer-left{
          position:absolute;
          left:14px; top:8px;
          font-family:"Inter", sans-serif;
          font-weight:400;
          font-size:9px;
          letter-spacing:0.06em;
          color:#5a626c;
          line-height:11px;
          text-transform:uppercase;
        }
        .footer-right{
          position:absolute;
          right:14px; top:9px;
          height:10px;
          display:flex;
          align-items:center;
          gap:6px;
        }
        .footer-dot{
          width:4px; height:4px;
          border-radius:50%;
          background:#52c49a;
        }
        .footer-right-text{
          font-family:"Inter", sans-serif;
          font-weight:500;
          font-size:8px;
          letter-spacing:0.08em;
          color:#5a626c;
          text-transform:uppercase;
          line-height:8px;
        }

          --bg:#060708;

          --panel:#12151a;
          --panelMid:#181b21;
          --raised:#1d2129;
